[project]
name = "agentic-survey-backend"
version = "0.1.0"
description = "FastAPI API for the Agentic Survey runtime"
requires-python = ">=3.12"
dependencies = [
  "ddgs>=9",
  "fastapi>=0.115",
  "hdbscan==0.8.42",
  "httpx>=0.27",
  "litellm==1.83.10",
  "pydantic-settings>=2.4",
  "pypdf==6.10.2",
  "PyYAML>=6.0",
  "readability-lxml==0.8.4.1",
  "surrealdb==1.0.8",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]
ingest = [
  "crawl4ai>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_survey"]

[tool.pytest.ini_options]
testpaths = ["tests"]
