model_list:
  - model_name: mira-chatter
    litellm_params:
      model: openai/${SURVEY_MINI_MODEL}
      api_base: ${SURVEY_MINI_ENDPOINT_URL}
  # --- Dynamo roles (LM Studio primary) ---
  # Each role below is also defined a second time pointing at OpenRouter so the
  # router can rotate to a hosted Nemotron when the local box is offline. The
  # OpenRouter entries are tagged with `_openrouter_fallback: true` and dropped
  # by the router builder when SURVEY_OPENROUTER_FALLBACK_ENABLED=false or the
  # api_key is empty. Keep LM Studio entries listed first so they win normally.
  - model_name: mira-scientist
    litellm_params:
      model: openai/${SURVEY_DYNAMO_MODEL}
      api_base: ${SURVEY_DYNAMO_ENDPOINT_URL}
    model_info:
      supports_response_schema: true
  - model_name: mira-scientist
    _openrouter_fallback: true
    litellm_params:
      model: openrouter/${SURVEY_OPENROUTER_DYNAMO_MODEL}
      api_key: ${SURVEY_OPENROUTER_API_KEY}
      api_base: ${SURVEY_OPENROUTER_BASE_URL}
    model_info:
      supports_response_schema: true
  - model_name: validator
    litellm_params:
      model: openai/${SURVEY_DYNAMO_MODEL}
      api_base: ${SURVEY_DYNAMO_ENDPOINT_URL}
    model_info:
      supports_response_schema: true
  - model_name: validator
    _openrouter_fallback: true
    litellm_params:
      model: openrouter/${SURVEY_OPENROUTER_DYNAMO_MODEL}
      api_key: ${SURVEY_OPENROUTER_API_KEY}
      api_base: ${SURVEY_OPENROUTER_BASE_URL}
    model_info:
      supports_response_schema: true
  - model_name: analyst
    litellm_params:
      model: openai/${SURVEY_DYNAMO_MODEL}
      api_base: ${SURVEY_DYNAMO_ENDPOINT_URL}
    model_info:
      supports_response_schema: true
  - model_name: analyst
    _openrouter_fallback: true
    litellm_params:
      model: openrouter/${SURVEY_OPENROUTER_DYNAMO_MODEL}
      api_key: ${SURVEY_OPENROUTER_API_KEY}
      api_base: ${SURVEY_OPENROUTER_BASE_URL}
    model_info:
      supports_response_schema: true
  - model_name: ingest
    litellm_params:
      model: openai/${SURVEY_DYNAMO_MODEL}
      api_base: ${SURVEY_DYNAMO_ENDPOINT_URL}
    model_info:
      supports_response_schema: true
  - model_name: ingest
    _openrouter_fallback: true
    litellm_params:
      model: openrouter/${SURVEY_OPENROUTER_DYNAMO_MODEL}
      api_key: ${SURVEY_OPENROUTER_API_KEY}
      api_base: ${SURVEY_OPENROUTER_BASE_URL}
    model_info:
      supports_response_schema: true
  - model_name: embeddings
    litellm_params:
      model: openai/${SURVEY_EMBEDDING_MODEL}
      api_base: ${SURVEY_DYNAMO_ENDPOINT_URL}
router_settings:
  routing_strategy: simple-shuffle
  retry_policy:
    MaxRetries: 2
    TimeoutBackoffMultiplier: 2
  cooldown_time: 30
