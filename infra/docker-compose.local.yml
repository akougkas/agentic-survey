services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    user: "0"
    command:
      - start
      - --log
      - info
      - --user
      - root
      - --pass
      - root
      - file:/data/database.db
    volumes:
      - surreal_data:/data
      - ./surrealdb/init.surql:/docker-entrypoint-initdb.d/init.surql:ro
    ports:
      - "8400:8000"
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      SURVEY_PUBLIC_BASE_URL: http://localhost:5270
      SURVEY_FRONTEND_ORIGIN: http://localhost:5270
      SURVEY_PRODUCT_BUNDLE_DIR: /app/examples/product-bundles/demo
      SURVEY_ADMIN_PASSWORD: ${SURVEY_ADMIN_PASSWORD:-change-me}
      SURVEY_LLM_ENABLED: ${SURVEY_LLM_ENABLED:-false}
      SURVEY_MINI_ENDPOINT_URL: ${SURVEY_MINI_ENDPOINT_URL:-http://mini:8080/v1}
      SURVEY_DYNAMO_ENDPOINT_URL: ${SURVEY_DYNAMO_ENDPOINT_URL:-http://dynamo:1234/v1}
      SURVEY_LLM_TIMEOUT_SECONDS: ${SURVEY_LLM_TIMEOUT_SECONDS:-60}
      SURVEY_SURREAL_URL: ws://surrealdb:8000
      SURVEY_SURREAL_NS: ${SURVEY_SURREAL_NS:-agentic_survey}
      SURVEY_SURREAL_DB: ${SURVEY_SURREAL_DB:-prod}
      SURVEY_SURREAL_USER: ${SURVEY_SURREAL_USER:-root}
      SURVEY_SURREAL_PASS: ${SURVEY_SURREAL_PASS:-root}
      SURVEY_SEARXNG_URL: http://searxng:8080
    depends_on:
      - surrealdb
      - searxng
    ports:
      - "8100:8100"
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command: ["python", "-m", "agentic_survey.tools.freshness"]
    environment:
      SURVEY_PUBLIC_BASE_URL: http://localhost:5270
      SURVEY_FRONTEND_ORIGIN: http://localhost:5270
      SURVEY_PRODUCT_BUNDLE_DIR: /app/examples/product-bundles/demo
      SURVEY_ADMIN_PASSWORD: ${SURVEY_ADMIN_PASSWORD:-change-me}
      SURVEY_LLM_ENABLED: ${SURVEY_LLM_ENABLED:-false}
      SURVEY_MINI_ENDPOINT_URL: ${SURVEY_MINI_ENDPOINT_URL:-http://mini:8080/v1}
      SURVEY_DYNAMO_ENDPOINT_URL: ${SURVEY_DYNAMO_ENDPOINT_URL:-http://dynamo:1234/v1}
      SURVEY_LLM_TIMEOUT_SECONDS: ${SURVEY_LLM_TIMEOUT_SECONDS:-60}
      SURVEY_SURREAL_URL: ws://surrealdb:8000
      SURVEY_SURREAL_NS: ${SURVEY_SURREAL_NS:-agentic_survey}
      SURVEY_SURREAL_DB: ${SURVEY_SURREAL_DB:-prod}
      SURVEY_SURREAL_USER: ${SURVEY_SURREAL_USER:-root}
      SURVEY_SURREAL_PASS: ${SURVEY_SURREAL_PASS:-root}
      SURVEY_SEARXNG_URL: http://searxng:8080
    depends_on:
      - surrealdb
      - searxng
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    environment:
      HOST: 0.0.0.0
      ORIGIN: http://localhost:5270
      PORT: 3000
      SURVEY_API_PROXY_TARGET: http://backend:8100
    depends_on:
      - backend
    ports:
      - "5270:3000"
    restart: unless-stopped

volumes:
  surreal_data:
