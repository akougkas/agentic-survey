services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    user: "0"
    command:
      - start
      - --log
      - info
      - --user
      - root
      - --pass
      - root
      - file:/data/database.db
    volumes:
      - surreal_data:/data
      - ./surrealdb/init.surql:/docker-entrypoint-initdb.d/init.surql:ro
    ports:
      - "8400:8000"
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      SURVEY_PUBLIC_BASE_URL: http://localhost:5270
      SURVEY_FRONTEND_ORIGIN: http://localhost:5270
      SURVEY_PRODUCT_BUNDLE_DIR: /app/examples/product-bundles/demo
      SURVEY_ADMIN_PASSWORD: ${SURVEY_ADMIN_PASSWORD:-change-me}
      SURVEY_LLM_ENABLED: ${SURVEY_LLM_ENABLED:-false}
      SURVEY_CHATTER_ENDPOINT_URL: ${SURVEY_CHATTER_ENDPOINT_URL:-http://localhost:8080/v1}
      SURVEY_CHATTER_MODEL: ${SURVEY_CHATTER_MODEL:-AgenticQwen-30B-A3B-i1-Q4_K_M}
      SURVEY_CHATTER_TEMPERATURE: ${SURVEY_CHATTER_TEMPERATURE:-0.7}
      SURVEY_SCIENTIST_ENDPOINT_URL: ${SURVEY_SCIENTIST_ENDPOINT_URL:-http://localhost:8080/v1}
      SURVEY_SCIENTIST_MODEL: ${SURVEY_SCIENTIST_MODEL:-AgenticQwen-30B-A3B-i1-Q4_K_M}
      SURVEY_SCIENTIST_TEMPERATURE: ${SURVEY_SCIENTIST_TEMPERATURE:-0.3}
      SURVEY_SCIENTIST_SUPPORTS_REASONING: ${SURVEY_SCIENTIST_SUPPORTS_REASONING:-false}
      SURVEY_SCIENTIST_CONTEXT_WINDOW_TOKENS: ${SURVEY_SCIENTIST_CONTEXT_WINDOW_TOKENS:-200000}
      SURVEY_EMBEDDING_MODEL: ${SURVEY_EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v2-moe}
      SURVEY_DEFAULT_INTERVIEWER_ENDPOINT: ${SURVEY_DEFAULT_INTERVIEWER_ENDPOINT:-chatter}
      SURVEY_LLM_TIMEOUT_SECONDS: ${SURVEY_LLM_TIMEOUT_SECONDS:-60}
      SURVEY_LLM_PREPLAN_REASONING_BUDGET_TOKENS: ${SURVEY_LLM_PREPLAN_REASONING_BUDGET_TOKENS:-1024}
      SURVEY_SURREAL_URL: ws://surrealdb:8000
      SURVEY_SURREAL_NS: ${SURVEY_SURREAL_NS:-agentic_survey}
      SURVEY_SURREAL_DB: ${SURVEY_SURREAL_DB:-prod}
      SURVEY_SURREAL_USER: ${SURVEY_SURREAL_USER:-root}
      SURVEY_SURREAL_PASS: ${SURVEY_SURREAL_PASS:-root}
      SURVEY_SEARXNG_URL: http://searxng:8080
    depends_on:
      - surrealdb
      - searxng
    ports:
      - "8100:8100"
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command: ["python", "-m", "agentic_survey.tools.freshness"]
    environment:
      SURVEY_PUBLIC_BASE_URL: http://localhost:5270
      SURVEY_FRONTEND_ORIGIN: http://localhost:5270
      SURVEY_PRODUCT_BUNDLE_DIR: /app/examples/product-bundles/demo
      SURVEY_ADMIN_PASSWORD: ${SURVEY_ADMIN_PASSWORD:-change-me}
      SURVEY_LLM_ENABLED: ${SURVEY_LLM_ENABLED:-false}
      SURVEY_CHATTER_ENDPOINT_URL: ${SURVEY_CHATTER_ENDPOINT_URL:-http://localhost:8080/v1}
      SURVEY_CHATTER_MODEL: ${SURVEY_CHATTER_MODEL:-AgenticQwen-30B-A3B-i1-Q4_K_M}
      SURVEY_CHATTER_TEMPERATURE: ${SURVEY_CHATTER_TEMPERATURE:-0.7}
      SURVEY_SCIENTIST_ENDPOINT_URL: ${SURVEY_SCIENTIST_ENDPOINT_URL:-http://localhost:8080/v1}
      SURVEY_SCIENTIST_MODEL: ${SURVEY_SCIENTIST_MODEL:-AgenticQwen-30B-A3B-i1-Q4_K_M}
      SURVEY_SCIENTIST_TEMPERATURE: ${SURVEY_SCIENTIST_TEMPERATURE:-0.3}
      SURVEY_SCIENTIST_SUPPORTS_REASONING: ${SURVEY_SCIENTIST_SUPPORTS_REASONING:-false}
      SURVEY_SCIENTIST_CONTEXT_WINDOW_TOKENS: ${SURVEY_SCIENTIST_CONTEXT_WINDOW_TOKENS:-200000}
      SURVEY_EMBEDDING_MODEL: ${SURVEY_EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v2-moe}
      SURVEY_DEFAULT_INTERVIEWER_ENDPOINT: ${SURVEY_DEFAULT_INTERVIEWER_ENDPOINT:-chatter}
      SURVEY_LLM_TIMEOUT_SECONDS: ${SURVEY_LLM_TIMEOUT_SECONDS:-60}
      SURVEY_LLM_PREPLAN_REASONING_BUDGET_TOKENS: ${SURVEY_LLM_PREPLAN_REASONING_BUDGET_TOKENS:-1024}
      SURVEY_SURREAL_URL: ws://surrealdb:8000
      SURVEY_SURREAL_NS: ${SURVEY_SURREAL_NS:-agentic_survey}
      SURVEY_SURREAL_DB: ${SURVEY_SURREAL_DB:-prod}
      SURVEY_SURREAL_USER: ${SURVEY_SURREAL_USER:-root}
      SURVEY_SURREAL_PASS: ${SURVEY_SURREAL_PASS:-root}
      SURVEY_SEARXNG_URL: http://searxng:8080
    depends_on:
      - surrealdb
      - searxng
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    environment:
      HOST: 0.0.0.0
      ORIGIN: http://localhost:5270
      PORT: 3000
      SURVEY_API_PROXY_TARGET: http://backend:8100
    depends_on:
      - backend
    ports:
      - "5270:3000"
    restart: unless-stopped

volumes:
  surreal_data:
