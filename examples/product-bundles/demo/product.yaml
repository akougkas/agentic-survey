slug: demo
name: Agentic Survey Demo
runtime: agentic-survey
branding:
  eyebrow: Agentic Survey
  title: Structured interview campaigns with Mira.
  description: >
    Design a campaign, invite participants, and review transcript signal from a
    reusable runtime that can mount product bundles cleanly.
ui:
  home:
    eyebrow: Operator Console
    operator_path_label: Operator path
    operator_path_title: Design a campaign
    operator_path_description: >
      Begin with Mira, define objectives, and shape the first outline.
    participant_path_label: Participant path
    participant_path_title: Resume a session
    participant_path_description: >
      Participants redeem an invitation, choose consent, and enter the interview
      loop.
    bundle_panel_title: Mounted bundle
    persona_panel_title: Mira
    persona_panel_description: >
      A synthetic field researcher with a measured voice, sharp memory, and no
      appetite for vague answers.
  admin:
    nav_label: Workspace
    workspace_eyebrow: Operator Workspace
    workspace_title: Campaign workflow
    login_eyebrow: Operator Access
    login_description: >
      Access stays behind the environment variable gate. The default remains
      `change-me` until you replace it.
    boundary_eyebrow: Operator boundary
    boundary_description: >
      Admin access stays behind the runtime password gate. Product identity,
      seed campaigns, and deployment config come from the mounted bundle instead
      of the shared UI shell.
    current_path_label: Current path
    current_path_description: >
      Sign in, review campaigns, launch seeded studies, move drafts live, and
      inspect participant transcripts from the same workspace.
campaigns:
  - slug: research-ops-baseline
    seed: campaigns/research-ops-baseline.yaml
