slug: citadl-community-pulse
title: CITADL Community Pulse — Adaptive Interviews on the Future of Agentic Data Lifecycle Management
description: 'A single conversational study, conducted entirely by Mira, that replaces the traditional multi-survey approach. One interview instrument adapts per respondent across roles (domain scientists, facility operators, tool and library developers, AI/ML practitioners, institutional leads) and across scientific domains. Mira infers the respondent''s profile from the opening turns, modulates her register accordingly, and selects probes from a structured rubric so that every conversation contributes coverage to the same eight-axis evidence map that will inform the Category I CITADL IDSS proposal.

  '
min_n: 120
max_n: 500
outline:
  research_question: 'What is the actual shape of community pain, trust, and desired agency across the scientific data lifecycle — mapped across roles, domains, and technical fluency — that must ground the architecture, governance, and sustainability decisions of the Category I CITADL IDSS proposal?

    '
  sampling_frame: 'Active participants in the U.S. scientific research and cyberinfrastructure ecosystem who have direct experience with scientific data at any phase of its lifecycle. Includes domain scientists and research engineers across materials, biology, chemistry, neuroscience, earth sciences, agriculture, additive manufacturing, healthcare, aerospace, physics, and adjacent fields; operators and architects of institutional and national computing and data facilities; developers of data management tools, libraries, and services; research software engineers embedded in scientific groups; AI/ML practitioners with applied or methods experience relevant to scientific workflows; and institutional or platform leads for national cyberinfrastructure including ACCESS, NDP, NAIRR, and domain data repositories. Recruitment proceeds through PI and Co-PI mailing lists, university lists, HPC user communities, DOE and NSF notification channels, ACCESS and NDP announcement streams, and open social
    outreach.

    '
  exclusion_criteria: 'Participants with no direct engagement with scientific data at any lifecycle phase. Pure administrative roles with no operational exposure to data workflows. Respondents who cannot consent for themselves. Respondents whose exclusive involvement is in non-scientific applications of AI (finance, advertising, consumer chat) without any bridge to research or research-infrastructure work.

    '
  publication_intent: 'Primary input to the July 2026 Category I CITADL IDSS proposal''s preliminary-work and community-engagement sections, including the requirements-traceability matrix, the architecture blueprint evidence base, the governance framework, and the sustainability model. Secondary artifact: the aggregated concept graph and thematic analysis published internally to the CITADL planning team, with quotable excerpts used in the proposal narrative under the consent language each respondent accepts at the start of their conversation.

    '
  axes:
  - 'R1 — Lifecycle pain topology: where friction concentrates per phase, grounded in recent concrete episodes.'
  - 'R2 — Trust gating conditions: the geography of where autonomy is acceptable, where review is required, where human judgment is irreducible, and why.'
  - 'R3 — Cross-phase coordination: narrative evidence of friction at the handoffs between lifecycle phases; the locus of the CITADL thesis.'
  - 'R4 — Natural-language intent: the concrete sentences respondents wish they could say to a system and have executed.'
  - 'R5 — Adoption ceiling gradient: the range between the first task the respondent would delegate to an agent and the last.'
  - 'R6 — Integration constraints: role-modulated practical limits on any national agentic data infrastructure (API surface, platforms, frameworks, trust posture).'
  - 'R7 — Community sovereignty: ownership, governance, accountability, and sustainability models the respondent would accept for a national agentic infrastructure.'
  - 'R8 — Counter-evidence solicitation: the respondent''s strongest objection to the CITADL vision as they understood it during this conversation.'
  objectives:
  - Infer respondent role, domain, technical fluency, and lifecycle surface area from the opening exchange; modulate probe selection and vocabulary register accordingly.
  - Cover R1–R8 with per-respondent depth calibrated to their role and available time; favor concrete episodes over self-assessments.
  - Solicit and record counter-evidence (R8) on every respondent without exception.
  - Collect the respondent's own natural-language intent sentences (R4) as a primary proposal artifact.
  probes:
  - Walk me through the last end-to-end data workflow you were involved with — where the data came from and where a result ended up.
  - Where in that flow did you personally spend the most time, or where did something most recently cost you a day you did not expect to lose?
  - When a tool or service produces something you need to trust, what do you actually do before you let that output count toward a real result?
  - Describe a moment when a decision made at one stage of a workflow came back to haunt you at a later stage — where did the disconnect sit?
  - If you could say one sentence to a system and have it carry out the work that would otherwise take you days, what would that sentence be?
  - What is the first task in your workflow you would be willing to hand off to an agent, and what is the last task you would ever hand off?
  - What would a national agentic data management infrastructure have to do — or refuse to do — to be integratable with your environment as you actually work in it today?
  - When an agent makes a consequential error in production, who do you think should be responsible, and how do you think that should be decided?
  - Where do you think the vision of this work, as you have understood it in this conversation, might be wrong or overstated?
