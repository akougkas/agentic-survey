    Acquisition, which is where data enters the world from instruments,
    simulations, or sensors; Preparation, which is the long tail of getting
    raw data into analysis-ready shape through cleaning, alignment, format
    conversion, and metadata enrichment; Storage, which is the policy
    problem of where data lives across performance tiers; Movement, which
    is the orchestrated transfer of data between locations; Decision
