slug: facility-operators
title: "CITADEL Survey B — Data Facility Operators & Tool Developers"
description: >
  Semi-structured conversations with operators of compute and data facilities,
  storage architects, tool and library developers, and RSEs about the current
  landscape of production data infrastructure, operational gaps, and what
  would be required to deploy AI-assisted autonomous data management at scale.
min_n: 8
max_n: 30

research_question: >
  What capabilities, interfaces, and governance frameworks would a national
  AI-assisted data management infrastructure need to support so that facility
  operators and tool developers could integrate it into production systems
  confidently and without eroding the ops-trust chain?

sampling_frame: >
  Operators of institutional or national computing and data facilities,
  storage systems architects and engineers, developers of data management
  libraries and services (I/O libraries, workflow tools, storage systems),
  research software engineers supporting scientific applications at scale,
  and platform leads for national cyberinfrastructure (ACCESS, NDP, NAIRR).
  Include facility leadership as long as they retain hands-on awareness of
  current ops reality.

exclusion_criteria: >
  Individual researchers without operational responsibility for infrastructure
  belong in Survey A. Pure ML-methods researchers without applied
  facility/tool work belong in Survey C.

publication_intent: >
  NSF IDSS planning grant deliverable. Expected outputs: a tool-and-gap
  inventory mapped to lifecycle phases, a ranked list of technical and
  governance barriers to production AI-agent deployment, and operator-voiced
  requirements for a national AI-assisted data infrastructure.

axes:
  - Current toolchain and service maturity by lifecycle phase
  - Operational challenges and the biggest day-to-day bottlenecks
  - Tool and library gaps that hold the facility back
  - AI/ML experiments already running in operational workflows
  - Barriers to autonomous-agent deployment in production
  - Integration, federation, and governance requirements

probes:
  - What's the hardest operational problem your facility is carrying right now?
  - Walk me through a typical dataset's lifecycle in your facility — ingest to archive.
  - Where do you already use automation? Where does it stop?
  - What would a trustworthy autonomous agent need to demonstrate before you'd grant it production access?
  - What federation or integration model would your facility actually accept, and what would you refuse?
  - If a national AI-assisted data infrastructure existed tomorrow, what capability would make you adopt early?

risk_register:
  - risk: Operator optimism about their own toolchain ("ours works fine")
    mitigation: Ask for specific recent incidents, capacity-plan surprises, or SLA near-misses, not general assessments.
  - risk: Defensive framing about current tool choices
    mitigation: Normalize "we'd rather have something else" answers; probe for desired-vs-actual gaps.
  - risk: Over-indexing on large national facilities, under-indexing on university centers
    mitigation: Track micro-form facility-type cell; surface advisory when any class is thin.
  - risk: Leading questions about "AI" that bias toward enthusiasm or skepticism
    mitigation: Let participants name the desired capability first; translate to AI framing only after they open it.

grounding_sources_approved: []

readiness_rationale: >
  Outline is ready when research_question is specific about what a national
  infrastructure would need (not just whether operators want one); axes cover
  lifecycle phases plus governance and federation; probes anchor in recent
  incidents and desired-vs-actual gaps; risk_register names operator-side
  biases not scientist-side ones.

decision_gate:
  gate: scientist_approval
  rationale: Scientist locks outline at launch; outline_snapshot preserves track integrity.

suggested_search_queries:
  - "HPC data facility operations challenges autonomous agents"
  - "Globus parallel filesystem tiering automation policy"
  - "federated identity national cyberinfrastructure AI governance"

outline:
  objectives:
    - Inventory operational tools and gaps against each lifecycle phase.
    - Capture the governance and interface requirements for operator-accepted AI agents.
    - Surface the biggest real-world barriers to production autonomy.
  probes:
    - What's the hardest operational problem your facility is carrying right now?
    - Where do you already use automation and where does it stop?
    - What would an autonomous agent need to demonstrate before you'd grant production access?
  rubric:
    coverage_dimensions:
      - Tool and service inventory across at least three lifecycle phases
      - At least one concrete incident or near-miss that shaped current practice
      - Governance and federation preferences with reasoning
    risk_checks:
      - Avoid framing as product pitch; this is qualitative research.
      - Seek desired-vs-actual gaps, not just current state.
      - Respect operator vocabulary; do not translate their terms into marketing language.
  freshness_query: "scientific data facility operations tooling autonomous agents governance"
  persona_hints:
    name: Mira
    role: synthetic field researcher with peer-sysadmin bearing
    tone: >
      concise, technically literate, respectful of ops time; comfortable with
      infrastructure vocabulary; no corporate-speak
    behavior: >
      Ask one precise question at a time. Favor recent incidents and concrete
      dataset lifecycles over abstract opinions. Short turns.
  consent_language: >
    Research interview for the NSF IDSS planning grant (CITADEL Task 1).
    Voluntary; skip, pause, or stop any time. Anonymous or named by your
    choice; named responses may be quoted with attribution.
  micro_form_schema:
    - key: role
      label: Primary role
      field_type: single_select
      required: true
      options:
        - Facility operator / systems administrator
        - Storage systems architect or engineer
        - Developer of data management tools or libraries
        - Research software engineer supporting scientific applications
        - Platform or service lead for national cyberinfrastructure
        - Other
    - key: facility_type
      label: Facility or organization type
      field_type: multi_select
      required: true
      options:
        - University / institutional HPC center
        - NSF-funded national facility (ACCESS, SDSC, TACC, etc.)
        - DOE national laboratory
        - Cloud service provider or commercial data center
        - National or domain-specific data repository
        - Software development organization (HDF Group, Globus, etc.)
        - Instrument facility (synchrotron, telescope, sensor network)
        - Other
    - key: data_scale
      label: Approximate data scale supported
      field_type: single_select
      required: true
      options: ["< 100 TB", "100 TB - 1 PB", "1 PB - 10 PB", "10 PB - 100 PB", "> 100 PB"]
    - key: domains_served
      label: Distinct user communities or scientific domains served
      field_type: single_select
      required: true
      options: ["1-2 domains", "3-5 domains", "6-10 domains", "10+ (general-purpose)"]
    - key: storage_tiers
      label: Storage tiers / technologies currently operated
      field_type: multi_select
      required: true
      options:
        - NVMe / local SSD
        - Parallel file systems (Lustre, GPFS, DAOS, WekaFS)
        - Object storage (S3-compatible, Ceph, MinIO)
        - Tape archive (HPSS, TSM)
        - Cloud storage (S3, Azure Blob, GCS)
        - Network-attached storage (NFS, SMB)
        - Database systems (relational, graph, time-series)
        - Specialized streaming / in-memory systems
        - Other
    - key: evidence_of_belonging
      label: In one sentence, describe a recent operational decision you made about your facility's data infrastructure.
      field_type: long_text
      required: true
  scientist_summary: >
    This track interviews operators and tool developers about production data
    infrastructure: what tools are mature, where the gaps are, and what
    capabilities and governance would have to land for AI-agent autonomy to
    be integratable. Goal: a production-reality gap inventory plus an
    operator-accepted adoption profile.

seed_sources:
  - kind: raw_text
    title: "CITADEL Survey B operations framing"
    content_inline: |
      Data lifecycle phases in production infrastructure:
      Acquisition: capturing and ingesting data from instruments or simulations.
      Preparation: cleaning, transformation, and metadata management at scale.
      Storage: placement across performance tiers, capacity planning, retention.
      Movement: cross-facility transfer, staging, replication.
      Decision support: analysis interfaces, provenance, discovery.
      Sharing: publication, access control, archival, FAIR compliance.

      A national AI-assisted data management infrastructure, as proposed by
      CITADEL, would augment each phase with agents that configure instruments,
      clean and enrich data, tier storage intelligently, prefetch and stage
      data across facilities, track provenance automatically, and support
      compliance and sharing at scale.
    rationale: >
      Gives Mira shared vocabulary for each lifecycle phase in operator terms;
      lets Brain B reference the framing without fabricating definitions.
