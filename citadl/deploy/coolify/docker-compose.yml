x-api-environment: &api-environment
  SURVEY_PUBLIC_BASE_URL: https://citadl.gnosis.run
  SURVEY_FRONTEND_ORIGIN: https://citadl.gnosis.run
  SURVEY_PRODUCT_BUNDLE_DIR: /app/citadl/bundle
  SURVEY_ADMIN_PASSWORD: ${SURVEY_ADMIN_PASSWORD}
  # LiteLLM's OpenAI-compatible client requires an api_key field even when
  # talking to local LM Studio / llama-server endpoints that ignore it. Any
  # non-empty value satisfies the check.
  OPENAI_API_KEY: ${OPENAI_API_KEY:-lm-studio}
  SURVEY_LLM_ENABLED: ${SURVEY_LLM_ENABLED:-true}
  SURVEY_LITELLM_CONFIG: ${SURVEY_LITELLM_CONFIG:-agentic_survey/llm/litellm_config.yaml}
  SURVEY_CHATTER_ENDPOINT_URL: ${SURVEY_CHATTER_ENDPOINT_URL}
  SURVEY_CHATTER_MODEL: ${SURVEY_CHATTER_MODEL:-Nemotron-3-Nano-Omni-30B-A3B-Reasoning-UD-Q4_K_M}
  SURVEY_CHATTER_TEMPERATURE: ${SURVEY_CHATTER_TEMPERATURE:-0.7}
  SURVEY_SCIENTIST_ENDPOINT_URL: ${SURVEY_SCIENTIST_ENDPOINT_URL}
  SURVEY_SCIENTIST_MODEL: ${SURVEY_SCIENTIST_MODEL:-nvidia-nemotron-3-nano-omni-30b-a3b-reasoning}
  SURVEY_SCIENTIST_TEMPERATURE: ${SURVEY_SCIENTIST_TEMPERATURE:-0.3}
  SURVEY_SCIENTIST_SUPPORTS_REASONING: ${SURVEY_SCIENTIST_SUPPORTS_REASONING:-true}
  SURVEY_SCIENTIST_CONTEXT_WINDOW_TOKENS: ${SURVEY_SCIENTIST_CONTEXT_WINDOW_TOKENS:-600000}
  SURVEY_EMBEDDING_MODEL: ${SURVEY_EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v2-moe}
  SURVEY_EMBEDDING_ENDPOINT_URL: ${SURVEY_EMBEDDING_ENDPOINT_URL:-${SURVEY_SCIENTIST_ENDPOINT_URL}}
  SURVEY_EMBEDDING_API_KEY: ${SURVEY_EMBEDDING_API_KEY:-${OPENAI_API_KEY:-lm-studio}}
  SURVEY_DEFAULT_INTERVIEWER_ENDPOINT: ${SURVEY_DEFAULT_INTERVIEWER_ENDPOINT:-chatter}
  SURVEY_LLM_TIMEOUT_SECONDS: ${SURVEY_LLM_TIMEOUT_SECONDS:-60}
  SURVEY_LLM_VISIBLE_REPLY_MAX_TOKENS: ${SURVEY_LLM_VISIBLE_REPLY_MAX_TOKENS:-4096}
  SURVEY_LLM_REPAIR_COMPLETION_TOKENS: ${SURVEY_LLM_REPAIR_COMPLETION_TOKENS:-1024}
  SURVEY_LLM_REASONING_BUDGET_TOKENS: ${SURVEY_LLM_REASONING_BUDGET_TOKENS:-8192}
  SURVEY_LLM_REASONING_FINAL_RESPONSE_TOKENS: ${SURVEY_LLM_REASONING_FINAL_RESPONSE_TOKENS:-4096}
  SURVEY_LLM_PREPLAN_REASONING_BUDGET_TOKENS: ${SURVEY_LLM_PREPLAN_REASONING_BUDGET_TOKENS:-1024}
  SURVEY_OPENROUTER_API_KEY: ${SURVEY_OPENROUTER_API_KEY:-}
  SURVEY_OPENROUTER_BASE_URL: ${SURVEY_OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
  SURVEY_OPENROUTER_SCIENTIST_MODEL: ${SURVEY_OPENROUTER_SCIENTIST_MODEL:-nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free}
  SURVEY_OPENROUTER_FALLBACK_ENABLED: ${SURVEY_OPENROUTER_FALLBACK_ENABLED:-false}
  SURVEY_RETRIEVAL_FORCE_MODE: ${SURVEY_RETRIEVAL_FORCE_MODE:-}
  SURVEY_REPOSITORY: surreal
  SURVEY_SURREAL_URL: ws://surrealdb:8000/rpc
  SURVEY_SURREAL_NS: ${SURVEY_SURREAL_NS:-agentic}
  SURVEY_SURREAL_DB: ${SURVEY_SURREAL_DB:-citadl}
  SURVEY_SURREAL_USER: ${SURVEY_SURREAL_USER:-root}
  SURVEY_SURREAL_PASS: ${SURVEY_SURREAL_PASS:-root}
  SURVEY_EXPORT_DIR: ${SURVEY_EXPORT_DIR:-/app/campaigns}
  SURVEY_SEARXNG_URL: http://searxng:8080
  SURVEY_FRESHNESS_DEFAULT_CRON: ${SURVEY_FRESHNESS_DEFAULT_CRON:-0 3 * * *}
  SURVEY_WEB_SEARCH_TOP_K: ${SURVEY_WEB_SEARCH_TOP_K:-10}
  SURVEY_FRESHNESS_POLL_SECONDS: ${SURVEY_FRESHNESS_POLL_SECONDS:-30}
  SURVEY_INGEST_MIN_CHARS: ${SURVEY_INGEST_MIN_CHARS:-500}
  SURVEY_INGEST_CRAWL4AI: ${SURVEY_INGEST_CRAWL4AI:-true}
  SURVEY_INGEST_HTTP_TIMEOUT_SECONDS: ${SURVEY_INGEST_HTTP_TIMEOUT_SECONDS:-30}
  SURVEY_INGEST_CRAWL4AI_TIMEOUT_SECONDS: ${SURVEY_INGEST_CRAWL4AI_TIMEOUT_SECONDS:-60}

services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    user: "0:0"
    command:
      - start
      - --log
      - info
      - --user
      - root
      - --pass
      - root
      - file:/data/database.db
    volumes:
      - surreal_data:/data
      - ../../../infra/surrealdb/init.surql:/docker-entrypoint-initdb.d/init.surql:ro
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ../../../infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  backend:
    image: ${SURVEY_API_IMAGE:?Set SURVEY_API_IMAGE to the pushed M11.10 API image}
    environment:
      <<: *api-environment
    volumes:
      - ../../bundle:/app/citadl/bundle:ro
    depends_on:
      - surrealdb
      - searxng
    expose:
      - "8100"
    networks:
      - default
      - coolify
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.citadl-surveys-api.rule=Host(`citadl.gnosis.run`) && PathPrefix(`/api`)
      - traefik.http.routers.citadl-surveys-api.entrypoints=http
      - traefik.http.routers.citadl-surveys-api.priority=100
      - traefik.http.services.citadl-surveys-api.loadbalancer.server.port=8100

  worker:
    image: ${SURVEY_API_IMAGE:?Set SURVEY_API_IMAGE to the pushed M11.10 API image}
    command: ["python", "-m", "agentic_survey.tools.freshness"]
    environment:
      <<: *api-environment
    volumes:
      - ../../bundle:/app/citadl/bundle:ro
    depends_on:
      - surrealdb
      - searxng
    restart: unless-stopped

  frontend:
    image: ${SURVEY_WEB_IMAGE:?Set SURVEY_WEB_IMAGE to the pushed M11.10 web image}
    environment:
      HOST: 0.0.0.0
      ORIGIN: https://citadl.gnosis.run
      PORT: 3000
      SURVEY_API_PROXY_TARGET: http://backend:8100
    depends_on:
      - backend
    expose:
      - "3000"
    networks:
      - default
      - coolify
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.citadl-surveys.rule=Host(`citadl.gnosis.run`)
      - traefik.http.routers.citadl-surveys.entrypoints=http
      - traefik.http.routers.citadl-surveys.priority=10
      - traefik.http.services.citadl-surveys.loadbalancer.server.port=3000

volumes:
  surreal_data:

networks:
  coolify:
    external: true
